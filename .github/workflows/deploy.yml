name: FreePDFToolz CI/CD Deployment

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - 'staging'
          - 'production'

jobs:
  # =========================================================================
  # 1. BACKEND TEST SUITE
  # =========================================================================
  test-backend:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (Cached)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'src/backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Backend Tests
        env:
          PYTHONPATH: src/backend:.
        run: |
          pytest src/tests/ -v

  # =========================================================================
  # 2. FRONTEND TEST SUITE
  # =========================================================================
  test-frontend:
    name: Run Frontend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Flutter Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            src/frontend/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('src/frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Run Frontend Tests
        run: |
          cd src/frontend
          flutter pub get
          flutter test

  # =========================================================================
  # 3. BACKEND DEPLOYMENT (Independent Parallel Job, Gated by test-backend)
  # =========================================================================
  deploy-backend:
    name: Deploy Backend to GCP Cloud Run
    needs: [test-backend]
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
      GCP_PROJECT: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' || github.ref == 'refs/heads/main') && (vars.FREEPDFTOOLZ_PROD_PROJECT || 'freeocr-staging-app') || (vars.FREEPDFTOOLZ_STAGING_PROJECT || 'freeocr-staging-app') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Push Backend Container Image via Cloud Build (Layer Cached)
        run: |
          gcloud builds submit src/backend \
            --config src/backend/cloudbuild.yaml \
            --project ${{ env.GCP_PROJECT }}

      - name: Deploy Backend to GCP Cloud Run (Scale-to-Zero & Preserve Secrets)
        run: |
          gcloud run deploy freepdftoolz-api \
            --image gcr.io/${{ env.GCP_PROJECT }}/freepdftoolz-backend:latest \
            --region us-central1 \
            --platform managed \
            --min-instances 0 \
            --max-instances 5 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --allow-unauthenticated \
            --update-env-vars "ENVIRONMENT=${{ env.DEPLOY_ENV }},API_BASE_URL=https://freepdftoolz.me" \
            --project ${{ env.GCP_PROJECT }}

  # =========================================================================
  # 4. FRONTEND DEPLOYMENT (Independent Parallel Job, Gated by test-frontend)
  # =========================================================================
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    needs: [test-frontend]
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
      GCP_PROJECT: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' || github.ref == 'refs/heads/main') && (vars.FREEPDFTOOLZ_PROD_PROJECT || 'freeocr-staging-app') || (vars.FREEPDFTOOLZ_STAGING_PROJECT || 'freeocr-staging-app') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Flutter Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            src/frontend/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('src/frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Compile Flutter Web Release Bundle
        run: |
          cd src/frontend
          flutter pub get
          flutter build web --release --no-wasm-dry-run

      - name: Deploy Frontend to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: live
          projectId: ${{ env.GCP_PROJECT }}
          target: freepdftoolz