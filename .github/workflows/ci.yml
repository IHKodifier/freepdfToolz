name: CI Test Suite

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests (FastAPI + Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (Cached)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'src/backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Execute Pytest Suite
        env:
          PYTHONPATH: src/backend:.
        run: |
          pytest src/tests/ -v

  frontend-tests:
    name: Frontend Unit & Widget Tests (Flutter Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Flutter Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            src/frontend/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('src/frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Frontend Dependencies & Execute Flutter Tests
        run: |
          cd src/frontend
          flutter pub get
          flutter test
